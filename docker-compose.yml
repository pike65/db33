services:
  db:
    image: postgres:17-alpine
    container_name: db3_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-believe123}
      POSTGRES_DB: ${POSTGRES_DB:-db3_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neo} -d ${POSTGRES_DB:-db3_db}"]
      interval: 3s
      retries: 10

  app:
    build: .
    container_name: db3_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-believe123}
      POSTGRES_DB: ${POSTGRES_DB:-db3_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"

volumes:
  pgdata: